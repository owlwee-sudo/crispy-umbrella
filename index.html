<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#16181d" />
    <meta name="description" content="A VS Code-style code editor that runs on your Android phone." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Pocket Code</title>
  </head>
  <body>
    <div id="app">
      <!-- Activity bar + drawer (explorer / search) -->
      <aside id="drawer" class="drawer" aria-label="Side bar">
        <nav class="activity">
          <button class="icon-btn activity-btn active" data-view="explorer" title="Explorer" aria-label="Explorer">
            <svg viewBox="0 0 24 24"><path d="M4 4h7l2 2h7v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg>
          </button>
          <button class="icon-btn activity-btn" data-view="search" title="Search" aria-label="Search">
            <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
          </button>
          <span class="spacer"></span>
          <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
          </button>
        </nav>

        <section class="panel" data-panel="explorer">
          <header class="panel-head">
            <span class="panel-title">Explorer</span>
            <span class="spacer"></span>
            <button class="icon-btn sm" data-cmd="file.new" title="New file" aria-label="New file">
              <svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg>
            </button>
            <button class="icon-btn sm" data-cmd="folder.new" title="New folder" aria-label="New folder">
              <svg viewBox="0 0 24 24"><path d="M4 5h6l2 2h8v12H4z"/><path d="M12 10v6M9 13h6"/></svg>
            </button>
            <button class="icon-btn sm" data-cmd="workspace.import" title="Import files" aria-label="Import files">
              <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>
            </button>
            <button class="icon-btn sm" data-cmd="workspace.export" title="Export as .zip" aria-label="Export as zip">
              <svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 19h16"/></svg>
            </button>
          </header>
          <div id="tree" class="tree" role="tree"></div>
        </section>

        <section class="panel" data-panel="search" hidden>
          <header class="panel-head"><span class="panel-title">Search</span></header>
          <div class="search-box">
            <input id="search-input" type="search" placeholder="Search in files" autocomplete="off" autocapitalize="off" spellcheck="false" />
            <label class="chk"><input type="checkbox" id="search-case" /> Aa</label>
          </div>
          <div id="search-results" class="search-results"></div>
        </section>
      </aside>
      <div id="scrim" class="scrim"></div>

      <!-- Main column -->
      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="menu-btn" title="Toggle side bar" aria-label="Toggle side bar">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div id="tabs" class="tabs" role="tablist"></div>
          <button class="icon-btn" data-cmd="terminal.toggle" title="Terminal (Linux VM)" aria-label="Terminal">
            <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 9.5l3 2.5-3 2.5M12 15h5"/></svg>
          </button>
          <button class="icon-btn" data-cmd="run.preview" title="Run / preview" aria-label="Run">
            <svg viewBox="0 0 24 24" class="fill"><path d="M7 4.5v15l12-7.5z"/></svg>
          </button>
          <button class="icon-btn" data-cmd="palette.open" title="Command palette" aria-label="Command palette">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" class="fill"/><circle cx="12" cy="12" r="1.4" class="fill"/><circle cx="19" cy="12" r="1.4" class="fill"/></svg>
          </button>
        </header>

        <div class="editor-wrap">
          <div id="editor"></div>
          <div id="welcome" class="welcome" hidden>
            <img class="logo" src="./icon.svg" alt="" />
            <h1>Pocket Code</h1>
            <p>Open a file from the side bar, or start something new.</p>
            <div class="welcome-actions">
              <button class="btn" data-cmd="file.new">New file</button>
              <button class="btn ghost" data-cmd="palette.files">Open file…</button>
              <button class="btn ghost" data-cmd="workspace.import">Import…</button>
            </div>
          </div>
        </div>

        <section id="term-panel" class="term-panel" hidden aria-label="Terminal">
          <header class="term-head">
            <span class="term-title">Terminal</span>
            <span class="term-sub">Linux · x86 VM</span>
            <span id="term-status" class="run-status"></span>
            <span class="spacer"></span>
            <button class="icon-btn sm" id="term-restart" title="Restart Linux" aria-label="Restart Linux">
              <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
            </button>
            <button class="icon-btn sm" data-cmd="terminal.toggle" title="Hide terminal (Linux keeps running)" aria-label="Hide terminal">
              <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </header>
          <div class="term-body">
            <div id="term" class="term"></div>
            <div class="term-boot" aria-live="polite">
              <div class="boot-orb"><span></span><span></span><span></span></div>
              <div id="term-boot-label" class="boot-label">Loading Linux…</div>
              <div class="boot-track"><div id="term-progress-bar" class="boot-bar"></div></div>
              <div class="boot-hint">An x86 PC is being emulated inside the app, so the first start takes a little while.</div>
            </div>
          </div>
          <div class="keys term-keys" aria-label="Terminal keys"></div>
        </section>

        <div id="keys" class="keys" aria-label="Extra keys"></div>

        <footer class="statusbar">
          <span id="st-save">Ready</span>
          <span class="spacer"></span>
          <button id="st-pos" class="st-btn">Ln 1, Col 1</button>
          <button id="st-indent" class="st-btn">Spaces: 2</button>
          <button id="st-lang" class="st-btn">Plain Text</button>
        </footer>
      </main>
    </div>

    <!-- Command palette -->
    <div id="palette" class="overlay" hidden>
      <div class="palette">
        <input id="palette-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <ul id="palette-list" class="palette-list" role="listbox"></ul>
      </div>
    </div>

    <!-- Run / preview (everything runs in a sandbox) -->
    <div id="preview" class="sheet" hidden>
      <header class="sheet-head">
        <span id="preview-title" class="sheet-title">Run</span>
        <span id="run-status" class="run-status"></span>
        <span class="spacer"></span>
        <button class="icon-btn sm" id="run-stop" title="Stop" aria-label="Stop" hidden>
          <svg viewBox="0 0 24 24" class="fill"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button class="icon-btn sm" id="preview-console-btn" title="Toggle console" aria-label="Toggle console">
          <svg viewBox="0 0 24 24"><path d="M4 6l6 6-6 6M12 18h8"/></svg>
        </button>
        <button class="icon-btn sm" id="preview-reload" title="Run again" aria-label="Run again">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
        </button>
        <button class="icon-btn sm" id="preview-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="sandbox-note" id="sandbox-note"></div>
      <div class="preview-body">
        <div id="stage" class="stage"></div>
        <div id="console" class="console">
          <div class="console-head"><span>Output</span><span class="spacer"></span><button class="link" id="console-clear">Clear</button></div>
          <pre id="console-out" class="console-out"></pre>
          <div class="stdin-box">
            <label for="stdin">Prepared input <span class="muted-inline">· optional, one line per input() / prompt()</span></label>
            <textarea id="stdin" rows="1" placeholder="Python asks you live. JS prompt() reads from here." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- Generic dialog -->
    <div id="dialog" class="overlay center" hidden>
      <form id="dialog-form" class="dialog">
        <h2 id="dialog-title"></h2>
        <div id="dialog-body"></div>
        <div class="dialog-actions">
          <button type="button" class="btn ghost" id="dialog-cancel">Cancel</button>
          <button type="submit" class="btn" id="dialog-ok">OK</button>
        </div>
      </form>
    </div>

    <!-- Action sheet (file context menu) -->
    <div id="actions" class="overlay bottom" hidden>
      <div class="action-sheet">
        <div id="actions-title" class="action-title"></div>
        <div id="actions-list"></div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="file-input" type="file" multiple hidden />

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
